services:
  app:
    build: .
    container_name: recette_app
    ports:
      - "8000:80"
    volumes:
      - ./src:/var/www/html
    depends_on:
      db:
        condition: service_healthy
    networks: [recette]

  db:
    image: mysql:latest
    container_name: recette_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-if0_43297722_topictrail}
      MYSQL_USER: ${DB_USERNAME:-laravel}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${DB_ROOT_PASSWORD:-root}"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [recette]

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: recette_phpmyadmin
    restart: unless-stopped
    environment:
      PMA_HOST: db
      PMA_USER: root
      PMA_PASSWORD: ${DB_ROOT_PASSWORD:-root}
      UPLOAD_LIMIT: 128M
    ports:
      - "8080:80"
    depends_on: [db]
    networks: [recette]

volumes:
  db_data:

networks:
  recette:
